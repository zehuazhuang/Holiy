name: holiy
description: "A new Flutter project."
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_spinkit: ^5.2.2
  encrypt: ^5.0.0
  convert: ^3.1.2
